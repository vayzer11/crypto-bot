<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoSignal Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#04060f;--bg2:#070a15;--bg3:#0a0e1a;--card:#0c1022;--card2:#0f1428;--border:#141d35;--border2:#1c2840;--accent:#00ff88;--accent2:#00d4ff;--red:#ff3366;--yellow:#f59e0b;--purple:#8b5cf6;--orange:#f97316;--text:#e2e8f0;--muted:#4a5568;--muted2:#64748b;--glow:0 0 20px rgba(0,255,136,.25)}
*{margin:0;padding:0;box-sizing:border-box} html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;display:flex;flex-direction:column}
header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--border);background:var(--bg2)}
.logo{font-family:Unbounded,sans-serif;font-size:14px}.logo span{color:var(--accent)}
.header-stats{display:flex;gap:10px;font-size:12px;color:var(--muted2)}
#fgBadge{padding:2px 8px;border-radius:999px;background:#0f1b31}
.live-indicator{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted2)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}
.tabs{height:40px;display:flex;gap:6px;padding:6px;background:var(--bg2);border-bottom:1px solid var(--border);overflow:auto}
.tabs button{border:1px solid var(--border);background:var(--card);color:var(--muted2);padding:5px 10px;border-radius:999px;white-space:nowrap}
.tabs .active{color:var(--accent);border-color:#1f3e35;box-shadow:var(--glow)}
main{flex:1;overflow:auto;padding:10px;background:radial-gradient(circle at 0 0,#0d1630 0,transparent 40%),var(--bg)}
.page{display:none}.page.active{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select,button{background:var(--card2);border:1px solid var(--border2);color:var(--text);padding:8px;border-radius:10px}
#marketProgress{font-size:12px;color:var(--muted2);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
.badges{display:flex;gap:5px;flex-wrap:wrap}.b{font-size:11px;padding:2px 6px;border-radius:999px}.buy{background:#0b2a21;color:var(--accent)}.sell{background:#341122;color:var(--red)}.wait{background:#2f2411;color:var(--yellow)}
.price{font-family:'JetBrains Mono',monospace;font-size:20px;margin:8px 0}
.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid var(--border);padding:6px;text-align:left}
.mobile-tabs{display:none;position:fixed;left:0;right:0;bottom:0;height:46px;background:var(--bg2);border-top:1px solid var(--border)}
.mobile-tabs button{flex:1;background:none;border:none;color:var(--muted2)}
.mobile-tabs .active{color:var(--accent)}
@media(max-width:900px){.tabs{display:none}.mobile-tabs{display:flex}main{padding-bottom:56px}}
  </style>
</head>
<body>
<header>
  <div class="logo">⚡ <span>Crypto</span>Signal</div>
  <div class="header-stats"><span id="totalMcap">MCap: —</span><span id="btcDom">BTC: —%</span><div id="fgBadge">F&G —</div></div>
  <div class="live-indicator"><div class="pulse-dot"></div><span id="lastUpdate">обновлено —</span></div>
</header>
<div class="tabs" id="tabs">
  <button class="active" data-tab="market">📊 Рынок</button><button data-tab="signals">🎯 Сигналы</button><button data-tab="screener">🔍 Скринер</button><button data-tab="scam">🚨 Скам</button><button data-tab="news">📰 Новости</button><button data-tab="portfolio">💼 Портфолио</button>
</div>
<main>
  <section id="market" class="page active">
    <div class="toolbar"><input id="search" placeholder="Поиск монеты..." style="flex:1"><button class="f active" data-f="all">Все</button><button class="f" data-f="buy">🟢 Купить</button><button class="f" data-f="sell">🔴 Продать</button><button class="f" data-f="wait">🟡 Ждать</button><button class="f" data-f="over">🔥 Перекуплен</button><button class="f" data-f="under">💎 Перепродан</button><button class="f" data-f="new">🆕 Новые</button><button class="f" data-f="meme">🐸 Мемы</button></div>
    <div id="marketProgress">Загрузка...</div>
    <div id="marketGrid" class="grid"></div>
  </section>
  <section id="signals" class="page"><div id="signalsGrid" class="grid"></div></section>
  <section id="screener" class="page"><div class="toolbar"><select id="scrSignal"><option>Все</option><option>Покупка</option><option>Продажа</option><option>Ждать</option></select><input type="range" id="rsiMin" min="0" max="100" value="0"><input type="range" id="rsiMax" min="0" max="100" value="100"><select id="scrChange"><option value="all">Любое</option><option value="up10">+10% и выше</option><option value="up5">+5% и выше</option><option value="down5">-5% и ниже</option><option value="down10">-10% и ниже</option></select><button onclick="runScreener()">🔍 ЗАПУСТИТЬ СКРИНЕР</button></div><div id="screenerCount"></div><table class="table"><thead><tr><th>Монета</th><th>Цена</th><th>24ч</th><th>RSI</th><th>Сигнал</th></tr></thead><tbody id="screenerResults"></tbody></table></section>
  <section id="scam" class="page"><div id="scamGrid" class="grid"></div></section>
  <section id="news" class="page"><div id="newsGrid" class="grid"></div></section>
  <section id="portfolio" class="page"><div class="toolbar"><input id="pSym" placeholder="SYMBOL"><input id="pAmt" type="number" placeholder="Amount"><input id="pBuy" type="number" placeholder="Buy Price"><button onclick="addPos()">Добавить</button></div><div id="portfolioSummary"></div><div id="portfolioGrid" class="grid"></div><canvas id="portfolioChart"></canvas></section>
</main>
<div class="mobile-tabs" id="mtabs"><button class="active" data-tab="market">📊</button><button data-tab="signals">🎯</button><button data-tab="screener">🔍</button><button data-tab="scam">🚨</button><button data-tab="news">📰</button><button data-tab="portfolio">💼</button></div>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let coins=[],filter='all',trendingIds=new Set();
const memeKeywords=['pepe','doge','shib','bonk','wif','floki','cat','frog','meme'];
const fmt=(n)=>n==null?'—':n>=1e12?`$${(n/1e12).toFixed(2)}T`:n>=1e9?`$${(n/1e9).toFixed(2)}B`:n>=1e6?`$${(n/1e6).toFixed(2)}M`:n>=1e3?`$${(n/1e3).toFixed(1)}K`:n>=1?`$${n.toLocaleString('ru-RU',{maximumFractionDigits:4})}`:`$${(+n).toFixed(10).replace(/0+$/,'')}`;
function calcSignal(coin){const ch24=coin.price_change_percentage_24h||0,ch7=coin.price_change_percentage_7d_in_currency||0,volRatio=(coin.total_volume/Math.max(coin.market_cap,1))*100;const rsi=Math.max(5,Math.min(95,50+ch7*.45+ch24*.35));let signal='ЖДАТЬ',sigClass='wait',score=50;if(rsi<30){signal='КУПИТЬ';sigClass='buy';score=80}else if(rsi<42){signal='ПОКУПАТЬ';sigClass='buy';score=65}else if(rsi<55){signal='ЖДАТЬ';sigClass='wait';score=50}else if(rsi<68){signal='ОСТОРОЖНО';sigClass='wait';score=35}else{signal='ПРОДАТЬ';sigClass='sell';score=20}if(ch24>10&&rsi<60)score+=10;if(volRatio>20)score+=5;return{signal,sigClass,score,rsi:Math.round(rsi),volRatio};}
async function fetchAllMarketCoins(){const allCoins=[];const pages=10;for(let page=1;page<=pages;page++){try{const url=`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=${page}&price_change_percentage=1h,24h,7d&sparkline=true`;const resp=await fetch(url);if(resp.status===429){await sleep(3000);page--;continue;}const data=await resp.json();if(!Array.isArray(data)||!data.length)break;allCoins.push(...data);document.getElementById('marketProgress').textContent=`Загрузка: ${allCoins.length} монет...`;await sleep(1200);}catch(e){await sleep(2000);}}try{const trending=await fetch('https://api.coingecko.com/api/v3/search/trending').then(r=>r.json());window.trendingIds=new Set((trending.coins||[]).map(c=>c.item?.id));}catch(e){}const seen=new Set();const unique=allCoins.filter(c=>{if(seen.has(c.id))return false;seen.add(c.id);return true;});document.getElementById('marketProgress').textContent=`Рынок: ${unique.length} монет · CoinGecko`;return unique;}
function card(c){const s=calcSignal(c),trend=trendingIds.has(c.id),ch=c.price_change_percentage_24h||0;return `<div class="card coin-item"><div class="row" style="display:flex;justify-content:space-between"><div><div><b>#${c.market_cap_rank||'—'} ${c.symbol.toUpperCase()}</b></div><div style="font-size:12px;color:#64748b">${c.name}</div></div><img src="${c.image}" width="28" height="28"></div><div class="badges"><span class="b ${s.sigClass}">${s.signal}</span><span class="b ${s.rsi<35?'buy':s.rsi>65?'sell':'wait'}">RSI ${s.rsi}</span>${trend?'<span class="b buy">🔥 TREND</span>':''}</div><div class="price">${fmt(c.current_price)}</div><div style="color:${ch>=0?'#00ff88':'#ff3366'}">24ч ${ch>=0?'+':''}${ch.toFixed(2)}%</div><div style="font-size:12px;color:#64748b">Vol/MCap: ${s.volRatio.toFixed(1)}%</div></div>`;}
function currentFiltered(){const q=(search.value||'').toLowerCase();return coins.filter(c=>{const s=calcSignal(c);if(q && !(`${c.name} ${c.symbol}`.toLowerCase().includes(q)))return false;if(filter==='buy'&&!(s.rsi<42))return false;if(filter==='sell'&&!(s.rsi>65))return false;if(filter==='wait'&&!(s.rsi>=42&&s.rsi<=65))return false;if(filter==='over'&&!(s.rsi>65))return false;if(filter==='under'&&!(s.rsi<35))return false;if(filter==='new'&& !((c.market_cap_rank||999)>300))return false;if(filter==='meme'&&!memeKeywords.some(k=>`${c.name} ${c.symbol}`.toLowerCase().includes(k)))return false;return true;});}
function renderMarket(){const rows=currentFiltered();marketGrid.innerHTML='';const chunk=rows.slice(0,220);for(const c of chunk){const div=document.createElement('div');div.innerHTML=card(c);marketGrid.appendChild(div.firstChild);} }
function renderSignals(){const mapped=coins.map(c=>({c,s:calcSignal(c)}));const buy=mapped.filter(x=>x.s.rsi<42).sort((a,b)=>b.s.score-a.s.score).slice(0,20);const sell=mapped.filter(x=>x.s.rsi>65).sort((a,b)=>a.s.score-b.s.score).slice(0,20);signalsGrid.innerHTML=[...buy.map(x=>`<div class='card'><b>🟢 ${x.c.symbol.toUpperCase()}</b><div>RSI ${x.s.rsi} | Score ${x.s.score}</div><div>Вход ${fmt(x.c.current_price)} | Стоп ${fmt(x.c.current_price*.93)} | TP ${fmt(x.c.current_price*1.12)}</div></div>`),...sell.map(x=>`<div class='card'><b>🔴 ${x.c.symbol.toUpperCase()}</b><div>RSI ${x.s.rsi} | Score ${x.s.score}</div><div>Возможна коррекция</div></div>` )].join('');}
function runScreener(){const rows=currentFiltered().map(c=>({c,s:calcSignal(c)}));screenerCount.textContent=`Найдено ${rows.length} монет из 1000+`;screenerResults.innerHTML=rows.slice(0,200).map(x=>`<tr><td>${x.c.symbol.toUpperCase()}</td><td>${fmt(x.c.current_price)}</td><td>${(x.c.price_change_percentage_24h||0).toFixed(2)}%</td><td>${x.s.rsi}</td><td>${x.s.signal}</td></tr>`).join('');}
function detectScams(arr){return arr.map(c=>{const ch24=c.price_change_percentage_24h||0,ch7=c.price_change_percentage_7d_in_currency||0,vr=c.total_volume/Math.max(c.market_cap,1),rank=c.market_cap_rank||9999;let risk=0;const flags=[];if(ch7>100&&ch24<-10){risk+=40;flags.push(`📉 Памп +${ch7.toFixed(0)}%, теперь -${Math.abs(ch24).toFixed(0)}%`)}if(vr>.5){risk+=35;flags.push(`🔴 Объём ${(vr*100).toFixed(0)}%`) }else if(vr>.25){risk+=15;flags.push(`⚠️ Vol ${(vr*100).toFixed(0)}%`)}if(rank>300&&c.market_cap>5e7){risk+=25;flags.push('🆕 Новая монета с большой капой')}if(ch7>200){risk+=20;flags.push('🚀 Экстремальный рост')}if(ch24<-30){risk+=15;flags.push('📉 Дамп')}return {...c,risk:Math.min(100,risk),flags};}).filter(c=>c.risk>=25).sort((a,b)=>b.risk-a.risk).slice(0,30)}
function renderScam(){const s=detectScams(coins);scamGrid.innerHTML=s.map(c=>`<div class='card'><b>${c.symbol.toUpperCase()}</b><div>Риск: ${c.risk}/100</div><div>${c.flags.slice(0,3).join('<br>')}</div></div>`).join('')||"<div class='card'>Нет явных скам-паттернов</div>";}
async function fetchNews(){const all=[];try{const cc=await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=RU&sortOrder=popular&extraParams=CryptoSignalBot').then(r=>r.json());all.push(...(cc.Data||[]).slice(0,15).map(a=>({title:a.title,source:a.source_info?.name||a.source,url:a.url,time:a.published_on*1000,sentiment:'neut'})));}catch(e){}
try{const tr=await fetch('https://api.coingecko.com/api/v3/search/trending').then(r=>r.json());all.push(...(tr.coins||[]).map(({item})=>({title:`🔥 ${item.name} (${item.symbol.toUpperCase()}) — в топе трендов`,source:'CoinGecko Trending',url:`https://www.coingecko.com/en/coins/${item.id}`,time:Date.now(),sentiment:'bull'})));}catch(e){}
all.sort((a,b)=>b.time-a.time);newsGrid.innerHTML=all.slice(0,30).map(n=>`<div class='card'><div style='font-size:12px;color:#64748b'>${n.source}</div><a href='${n.url}' target='_blank' style='color:#e2e8f0;text-decoration:none'><b>${n.title}</b></a><div style='font-size:12px;color:#64748b'>${new Date(n.time).toLocaleString('ru-RU')}</div></div>`).join('');}
function renderPortfolio(){const p=JSON.parse(localStorage.getItem('portfolio')||'[]');let totalValue=0,totalCost=0;const positions=p.map((pos,i)=>{const coin=coins.find(c=>c.symbol.toUpperCase()===String(pos.symbol).toUpperCase());const cur=coin?.current_price||pos.buyPrice;const val=cur*pos.amount,cost=pos.buyPrice*pos.amount,pnl=val-cost,pnlPct=cost>0?pnl/cost*100:0;totalValue+=val;totalCost+=cost;return {...pos,cur,val,pnl,pnlPct,index:i};});const totalPnl=totalValue-totalCost,totalPnlPct=totalCost>0?totalPnl/totalCost*100:0;portfolioSummary.innerHTML=`<div class='card'>Итого: ${fmt(totalValue)} | PnL: <span style='color:${totalPnl>=0?'#00ff88':'#ff3366'}'>${fmt(totalPnl)} (${totalPnlPct.toFixed(2)}%)</span></div>`;portfolioGrid.innerHTML=positions.map(p=>`<div class='card'><b>${p.symbol}</b><div>${p.amount} @ ${fmt(p.buyPrice)}</div><div>Текущая: ${fmt(p.cur)}</div><div style='color:${p.pnl>=0?'#00ff88':'#ff3366'}'>PnL ${fmt(p.pnl)} (${p.pnlPct.toFixed(2)}%)</div><button onclick='delPos(${p.index})'>Удалить</button></div>`).join('');}
function addPos(){const symbol=pSym.value.toUpperCase().trim();const amount=+pAmt.value;const buyPrice=+pBuy.value;if(!symbol||!amount||!buyPrice)return;const p=JSON.parse(localStorage.getItem('portfolio')||'[]');p.push({symbol,amount,buyPrice});localStorage.setItem('portfolio',JSON.stringify(p));renderPortfolio();}
function delPos(i){const p=JSON.parse(localStorage.getItem('portfolio')||'[]');p.splice(i,1);localStorage.setItem('portfolio',JSON.stringify(p));renderPortfolio();}
function bindTabs(){[...document.querySelectorAll('[data-tab]')].forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-tab='${b.dataset.tab}']`).forEach(x=>x.classList.add('active'));});}
async function boot(){bindTabs();coins=await fetchAllMarketCoins();try{const glob=await fetch('https://api.coingecko.com/api/v3/global').then(r=>r.json());const d=glob.data||{};totalMcap.textContent=`MCap: ${fmt((d.total_market_cap||{}).usd||0)}`;btcDom.textContent=`BTC: ${((d.market_cap_percentage||{}).btc||0).toFixed(1)}%`;}catch(e){}try{const fg=await fetch('https://api.alternative.me/fng/').then(r=>r.json());fgBadge.textContent=`F&G ${((fg.data||[{}])[0].value||'—')}`;}catch(e){}
lastUpdate.textContent=`обновлено ${new Date().toLocaleTimeString('ru-RU')}`;renderMarket();renderSignals();renderScam();await fetchNews();renderPortfolio();}
search.oninput=renderMarket;document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;renderMarket();});
setInterval(async()=>{coins=await fetchAllMarketCoins();renderMarket();renderSignals();renderScam();renderPortfolio();lastUpdate.textContent=`обновлено ${new Date().toLocaleTimeString('ru-RU')}`;},90000);
setInterval(fetchNews,300000);
boot();
</script>
</body>
</html>
