<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoSignal Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap");
:root{--bg:#060810;--bg2:#080c16;--card:#0c1220;--border:#151e35;--accent:#00ff88;--accent2:#00c8ff;--red:#ff2d55;--yellow:#f59e0b;--purple:#8b5cf6;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box}body,html{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
body{display:flex;flex-direction:column}
header{padding:10px;border-bottom:1px solid var(--border);background:linear-gradient(120deg,#0d1529,#070b15)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-family:Unbounded,sans-serif}.logo span{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px;margin-top:8px}.stat{background:rgba(12,18,32,.85);backdrop-filter:blur(10px);border:1px solid var(--border);padding:8px;border-radius:10px}
.k{font-size:11px;color:var(--muted)}.v{font-family:"JetBrains Mono",monospace;font-size:13px}
.tabs{display:flex;gap:6px;padding:8px;overflow:auto;border-bottom:1px solid var(--border)}
.tabs button,.pills button,.preset{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 10px;border-radius:999px;white-space:nowrap}
.tabs .active,.pills .active{color:var(--accent);box-shadow:0 0 20px rgba(0,255,136,.25)}
main{flex:1;overflow:auto;padding:10px}.page{display:none}.page.active{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:rgba(12,18,32,.92);border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted);font-size:12px}.price{font-family:"JetBrains Mono",monospace;font-size:20px}
.badge{font-size:11px;padding:2px 6px;border-radius:999px}.buy{background:#093426;color:var(--accent)}.sell{background:#351120;color:var(--red)}.wait{background:#34290f;color:var(--yellow)}.new{background:#21143f;color:#c4b5fd}
.spark{width:100%;height:36px}
.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid var(--border);padding:7px;text-align:left;font-size:13px}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20}.detail.open{display:block}
.panel{position:absolute;right:0;top:0;height:100%;width:min(680px,100%);background:var(--bg2);padding:12px;overflow:auto;border-left:1px solid var(--border)}
.panel canvas{background:#0b1120;border:1px solid var(--border);border-radius:10px;padding:6px;margin-top:8px}
.news-filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--border);background:var(--bg2);z-index:8}
.mobile-tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px}.mobile-tabs .active{color:var(--accent)}
@media(max-width:900px){.tabs{display:none}.mobile-tabs{display:flex}main{padding-bottom:60px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:375px){.grid{grid-template-columns:1fr}.price{font-size:17px}.stat{padding:6px}.tabs button,.pills button,.preset{padding:6px 8px;font-size:12px}}
  </style>
</head>
<body>
<header>
  <div class="top"><div class="logo">⚡ <span>CryptoSignal</span> Pro</div><div id="lastUpdate" class="muted">обновлено —</div></div>
  <div class="stats">
    <div class="stat"><div class="k">Total MCap</div><div id="stMcap" class="v">—</div></div>
    <div class="stat"><div class="k">BTC Dominance</div><div id="stBtc" class="v">—</div></div>
    <div class="stat"><div class="k">24h Volume</div><div id="stVol" class="v">—</div></div>
    <div class="stat"><div class="k">Active Coins</div><div id="stCoins" class="v">—</div></div>
  </div>
</header>
<div class="tabs">
  <button class="active" data-tab="market">📊 Рынок</button><button data-tab="signals">🎯 Сигналы</button><button data-tab="screener">🔍 Скринер</button><button data-tab="scam">🚨 Скам</button><button data-tab="news">📰 Новости</button><button data-tab="portfolio">💼 Портфолио</button>
</div>
<main>
  <section id="market" class="page active">
    <div class="toolbar"><input id="search" placeholder="Поиск..." style="flex:1"></div>
    <div class="pills toolbar"><button class="active f" data-f="all">Все</button><button class="f" data-f="buy">🟢 Купить</button><button class="f" data-f="sell">🔴 Продать</button><button class="f" data-f="new">🆕 Новые</button><button class="f" data-f="meme">🐸 Мемы</button></div>
    <div id="marketGrid" class="grid"></div>
  </section>
  <section id="signals" class="page"><div id="signalsGrid" class="grid"></div></section>
  <section id="screener" class="page">
    <div class="toolbar">
      <button class="preset" data-p="oversold">RSI Oversold</button><button class="preset" data-p="volume">High Volume</button><button class="preset" data-p="newgems">New Gems</button><button class="preset" data-p="defi">DeFi</button><button class="preset" data-p="ai">AI Tokens</button><button class="preset" data-p="meme">Meme Coins</button>
    </div>
    <div class="toolbar">
      <select id="scrSignal"><option value="all">Все</option><option value="buy">Купить</option><option value="sell">Продать</option></select>
      <input id="rsiMin" type="number" min="0" max="100" value="0" placeholder="RSI min">
      <input id="rsiMax" type="number" min="0" max="100" value="100" placeholder="RSI max">
      <select id="scrCap"><option value="all">Капа: любая</option><option value="micro">Micro</option><option value="small">Small</option><option value="large">Large</option></select>
      <button onclick="runScreener()">Запустить</button>
    </div>
    <div id="screenerCount" class="muted"></div>
    <table class="table"><thead><tr><th>Монета</th><th>Цена</th><th>24ч</th><th>RSI</th><th>Сигнал</th></tr></thead><tbody id="screenerResults"></tbody></table>
  </section>
  <section id="scam" class="page"><div id="scamGrid" class="grid"></div></section>
  <section id="news" class="page">
    <div class="news-filters"><button class="nf active" data-nf="all">All</button><button class="nf" data-nf="reddit">Reddit</button><button class="nf" data-nf="news">News</button><button class="nf" data-nf="defi">DeFi</button><button class="nf" data-nf="meme">Meme</button></div>
    <div id="newsGrid" class="grid"></div>
  </section>
  <section id="portfolio" class="page">
    <div class="toolbar"><input id="pSym" placeholder="SYMBOL"><input id="pAmt" type="number" placeholder="Amount"><input id="pBuy" type="number" placeholder="Buy price"><button onclick="addPos()">Добавить</button></div>
    <div id="portfolioSummary"></div><div id="portfolioGrid" class="grid"></div>
  </section>
</main>
<div class="mobile-tabs"><button class="active" data-tab="market">📊</button><button data-tab="signals">🎯</button><button data-tab="screener">🔍</button><button data-tab="scam">🚨</button><button data-tab="news">📰</button><button data-tab="portfolio">💼</button></div>
<div id="detail" class="detail"><div class="panel"><button onclick="closeDetail()">Закрыть</button><div id="detailInfo"></div><canvas id="priceChart" height="140"></canvas><canvas id="rsiChart" height="100"></canvas></div></div>
<script>
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const fmt=(n)=>n==null?"—":n>=1e12?`$${(n/1e12).toFixed(2)}T`:n>=1e9?`$${(n/1e9).toFixed(2)}B`:n>=1e6?`$${(n/1e6).toFixed(2)}M`:n>=1e3?`$${(n/1e3).toFixed(1)}K`:n>=1?`$${n.toLocaleString("ru-RU",{maximumFractionDigits:4})}`:`$${(+n).toFixed(10).replace(/0+$/,"")}`;
const meme=["pepe","doge","shib","bonk","wif","floki","cat","frog","meme"],aiTokens=["fet","rndr","tao","agix","ocean","arkm"],defi=["aave","uni","crv","mkr","pendle"];
let coins=[],allCoins=[],filter="all",newsFilter="all",newsRows=[],sparkCharts={},detailPriceChart=null,detailRsiChart=null,screenerTag="all";
function sig(c){const ch24=c.price_change_percentage_24h||0,ch7=c.price_change_percentage_7d_in_currency||0,r=Math.max(5,Math.min(95,50+ch7*0.45+ch24*0.35));const type=r<42?"buy":r>65?"sell":"wait";return{rsi:Math.round(r),type,text:type==="buy"?"ПОКУПАТЬ":type==="sell"?"ПРОДАВАТЬ":"ЖДАТЬ"}}
async function fetchCoins(){const out=[];for(let p=1;p<=6;p++){try{const r=await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=${p}&price_change_percentage=24h,7d&sparkline=true`);out.push(...await r.json());await sleep(700);}catch(e){}}return out}
function sentiment(title){const t=title.toLowerCase();const bull=["surge","rally","pump","breakout","bull","рост","взлет"],bear=["crash","dump","hack","exploit","bear","падение","обвал"];if(bull.some(x=>t.includes(x)))return "🟢 bullish";if(bear.some(x=>t.includes(x)))return "🔴 bearish";return "⚪ neutral"}
function extractCoins(text){const m=text.toUpperCase().match(/\$?[A-Z]{2,10}/g)||[];return [...new Set(m.map(x=>x.replace("$","")).filter(x=>x.length<=8))].slice(0,4).join(", ")}
function isNewListing(c){if(!c.atl_date)return false;return (Date.now()-new Date(c.atl_date).getTime())<30*86400000}
function marketFilter(c){const s=sig(c),str=`${c.name} ${c.symbol}`.toLowerCase();if((search.value||"").trim()&&!str.includes(search.value.toLowerCase()))return false;if(filter==="buy"&&s.type!=="buy")return false;if(filter==="sell"&&s.type!=="sell")return false;if(filter==="new"&&!isNewListing(c))return false;if(filter==="meme"&&!meme.some(k=>str.includes(k)))return false;return true}
function cardHtml(c,i){const s=sig(c),chg=c.price_change_percentage_24h||0;return `<div class="card" onclick="openDetail('${c.id}')"><div class="row"><div><b>#${c.market_cap_rank||"—"} ${c.symbol.toUpperCase()}</b><div class="muted">${c.name}</div></div><img src="${c.image}" width="26" height="26"></div><div class="row" style="margin:6px 0"><span class="badge ${s.type}">${s.text}</span><span class="badge ${s.rsi<35?"buy":s.rsi>65?"sell":"wait"}">RSI ${s.rsi}</span>${isNewListing(c)?'<span class="badge new">NEW</span>':""}</div><div class="price">${fmt(c.current_price)}</div><div class="muted" style="color:${chg>=0?"var(--accent)":"var(--red)"}">24ч ${chg>=0?"+":""}${chg.toFixed(2)}%</div><canvas class="spark" id="spark-${i}"></canvas></div>`}
function renderMarket(){const rows=coins.filter(marketFilter).slice(0,200);marketGrid.innerHTML=rows.map((c,i)=>cardHtml(c,i)).join("");rows.forEach((c,i)=>renderSpark(`spark-${i}`,c.sparkline_in_7d?.price||[]))}
function renderSpark(id,data){const el=document.getElementById(id);if(!el||!data.length)return;if(sparkCharts[id])sparkCharts[id].destroy();const short=[0,1,2,3,4,5,6].map(x=>data[Math.floor((data.length-1)*(x/6))]||data[0]);sparkCharts[id]=new Chart(el,{type:"line",data:{labels:short.map((_,i)=>i+1),datasets:[{data:short,borderColor:short.at(-1)>=short[0]?"#00ff88":"#ff2d55",borderWidth:1.5,pointRadius:0,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}},responsive:true,maintainAspectRatio:false}})}
function renderSignals(){const m=coins.map(c=>({c,s:sig(c)}));const buy=m.filter(x=>x.s.type==="buy").slice(0,12),sell=m.filter(x=>x.s.type==="sell").slice(0,12);signalsGrid.innerHTML=[...buy.map(x=>`<div class="card" onclick="openDetail('${x.c.id}')"><b>🟢 ${x.c.symbol.toUpperCase()}</b><div>RSI ${x.s.rsi}</div><div>Вход ${fmt(x.c.current_price)} | Стоп ${fmt(x.c.current_price*.93)} | TP ${fmt(x.c.current_price*1.12)}</div></div>`),...sell.map(x=>`<div class="card" onclick="openDetail('${x.c.id}')"><b>🔴 ${x.c.symbol.toUpperCase()}</b><div>RSI ${x.s.rsi}</div><div>Вероятна коррекция</div></div>`)].join("")}
function runScreener(){const min=+rsiMin.value,max=+rsiMax.value,ss=scrSignal.value,cap=scrCap.value;const rows=allCoins.filter(c=>{const s=sig(c),m=c.market_cap||0,name=`${c.name} ${c.symbol}`.toLowerCase();if(s.rsi<min||s.rsi>max)return false;if(ss!=="all"&&s.type!==ss)return false;if(cap==="micro"&&m>=1e8)return false;if(cap==="small"&&(m<1e8||m>=1e9))return false;if(cap==="large"&&m<1e10)return false;if(screenerTag==="defi"&&!defi.includes(c.symbol.toLowerCase()))return false;if(screenerTag==="ai"&&!aiTokens.includes(c.symbol.toLowerCase()))return false;if(screenerTag==="meme"&&!meme.some(k=>name.includes(k)))return false;return true});screenerCount.textContent=`Найдено ${rows.length}`;screenerResults.innerHTML=rows.slice(0,200).map(c=>{const s=sig(c);return `<tr><td>${c.symbol.toUpperCase()}</td><td>${fmt(c.current_price)}</td><td>${(c.price_change_percentage_24h||0).toFixed(2)}%</td><td>${s.rsi}</td><td>${s.text}</td></tr>`}).join("")}
function applyPreset(p){screenerTag="all";scrCap.value="all";if(p==="oversold"){rsiMin.value=0;rsiMax.value=35;scrSignal.value="buy"}if(p==="volume"){rsiMin.value=20;rsiMax.value=70;scrSignal.value="all"}if(p==="newgems"){rsiMin.value=25;rsiMax.value=60;scrCap.value="micro"}if(p==="defi"){screenerTag="defi"}if(p==="ai"){screenerTag="ai"}if(p==="meme"){screenerTag="meme"}runScreener()}
function renderScam(){const rows=coins.map(c=>{const ch24=c.price_change_percentage_24h||0,ch7=c.price_change_percentage_7d_in_currency||0,v=(c.total_volume||0)/Math.max(c.market_cap||1,1);let risk=0,f=[];if(ch7>80&&ch24<-8){risk+=40;f.push("Pump and dump")}if(v>.4){risk+=35;f.push("Vol/MCap аномалия")}if((c.market_cap_rank||999)>250&&(c.market_cap||0)>5e7){risk+=20;f.push("Новая монета с большой капой")}return{...c,risk:Math.min(100,risk),f}}).filter(x=>x.risk>=30).sort((a,b)=>b.risk-a.risk).slice(0,20);scamGrid.innerHTML=rows.map(x=>`<div class="card"><b>${x.symbol.toUpperCase()}</b><div>Риск ${x.risk}/100</div><div class="muted">${x.f.join(" · ")}</div></div>`).join("")||"<div class='card'>Подозрительных не найдено</div>"}
async function fetchNews(){const out=[];try{const cg=await fetch("https://api.coingecko.com/api/v3/news").then(r=>r.json());(cg.data||[]).slice(0,15).forEach(n=>out.push({source:"coingecko",title:n.title,url:n.url,time:new Date(n.updated_at||n.created_at).getTime()||Date.now(),tag:"news"}));}catch(e){}
try{const cp=await fetch("https://cryptopanic.com/api/free/v1/posts/?auth_token=free&kind=news").then(r=>r.json());(cp.results||[]).slice(0,20).forEach(n=>out.push({source:"cryptopanic",title:n.title,url:n.url,time:new Date(n.created_at).getTime(),tag:"news"}));}catch(e){}
for(const [u,tag] of [["https://www.reddit.com/r/CryptoCurrency/hot.json?limit=25","reddit"],["https://www.reddit.com/r/CryptoMoonShots/hot.json?limit=25","meme"],["https://www.reddit.com/r/defi/hot.json?limit=25","defi"]]){try{const d=await fetch(u,{headers:{"User-Agent":"Mozilla/5.0"}}).then(r=>r.json());(d.data?.children||[]).slice(0,15).forEach(x=>out.push({source:"reddit",title:x.data.title,url:`https://reddit.com${x.data.permalink}`,time:(x.data.created_utc||0)*1000,tag}));await sleep(600);}catch(e){}}
newsRows=out.sort((a,b)=>b.time-a.time);renderNews()}
function renderNews(){const rows=newsRows.filter(n=>newsFilter==="all"||n.source===newsFilter||n.tag===newsFilter);newsGrid.innerHTML=rows.slice(0,40).map(n=>`<div class="card"><div class="muted">${n.source.toUpperCase()} · ${new Date(n.time).toLocaleString("ru-RU")}</div><a href="${n.url}" target="_blank" style="color:var(--text);text-decoration:none"><b>${n.title}</b></a><div class="muted">${sentiment(n.title)} · coins: ${extractCoins(n.title)||"—"}</div></div>`).join("")}
async function openDetail(id){const c=coins.find(x=>x.id===id);if(!c)return;detail.classList.add("open");const det=await fetch(`https://api.coingecko.com/api/v3/coins/${id}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=true`).then(r=>r.json()).catch(()=>({market_data:{},developer_data:{}}));const md=det.market_data||{},dev=det.developer_data||{};detailInfo.innerHTML=`<h3>${c.name} (${c.symbol.toUpperCase()})</h3><div class="muted">Цена ${fmt(c.current_price)} · ATL ${fmt((md.atl||{}).usd||c.atl)} · Circulating ${fmt((md.circulating_supply)||c.circulating_supply||0)} · Total ${fmt((md.total_supply)||c.total_supply||0)} · Dev activity ${(dev.commit_count_4_weeks||0)} commits/4w</div>`;
const ch=await fetch(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=7`).then(r=>r.json()).catch(()=>({prices:[],total_volumes:[]}));
const p=(ch.prices||[]).map(x=>x[1]),v=(ch.total_volumes||[]).map(x=>x[1]);const labels=p.map((_,i)=>i+1);
if(detailPriceChart)detailPriceChart.destroy();detailPriceChart=new Chart(priceChart,{data:{labels,datasets:[{type:"line",label:"Цена",data:p,borderColor:"#00c8ff",pointRadius:0,tension:.3,yAxisID:"y"},{type:"bar",label:"Объём",data:v,backgroundColor:"rgba(0,255,136,.25)",yAxisID:"y1"}]},options:{plugins:{legend:{labels:{color:"#e2e8f0"}}},scales:{x:{ticks:{display:false}},y:{ticks:{color:"#94a3b8"}},y1:{position:"right",grid:{display:false},ticks:{display:false}}}}});
const rsi=[];for(let i=0;i<p.length;i++){const s=Math.max(0,i-14),chunk=p.slice(s,i+1);const dif=chunk.slice(1).map((x,j)=>x-chunk[j]);const up=dif.filter(x=>x>0).reduce((a,b)=>a+b,0)/14,down=Math.abs(dif.filter(x=>x<0).reduce((a,b)=>a+b,0)/14)||1;rsi.push(Math.max(0,Math.min(100,100-(100/(1+up/down)))));}
if(detailRsiChart)detailRsiChart.destroy();detailRsiChart=new Chart(rsiChart,{type:"line",data:{labels,datasets:[{label:"RSI",data:rsi,borderColor:"#f59e0b",pointRadius:0,tension:.25}]},options:{plugins:{legend:{labels:{color:"#e2e8f0"}}},scales:{x:{ticks:{display:false}},y:{min:0,max:100,ticks:{color:"#94a3b8"}}}}})
}
function closeDetail(){detail.classList.remove("open")}
function renderPortfolio(){const p=JSON.parse(localStorage.getItem("portfolio")||"[]");let tv=0,tc=0;const rows=p.map((x,i)=>{const c=coins.find(k=>k.symbol.toUpperCase()===x.symbol.toUpperCase());const cur=c?.current_price||x.buyPrice,val=cur*x.amount,cost=x.buyPrice*x.amount,pnl=val-cost;tv+=val;tc+=cost;return {...x,cur,pnl,val,i}});portfolioSummary.innerHTML=`<div class="card">Total ${fmt(tv)} | PnL <span style="color:${tv-tc>=0?'var(--accent)':'var(--red)'}">${fmt(tv-tc)}</span></div>`;portfolioGrid.innerHTML=rows.map(x=>`<div class="card"><b>${x.symbol}</b><div>${x.amount} @ ${fmt(x.buyPrice)}</div><div>${fmt(x.cur)}</div><div style="color:${x.pnl>=0?'var(--accent)':'var(--red)'}">${fmt(x.pnl)}</div><button onclick="delPos(${x.i})">Удалить</button></div>`).join("")}
function addPos(){const p=JSON.parse(localStorage.getItem("portfolio")||"[]"),sym=pSym.value.toUpperCase().trim(),amount=+pAmt.value,buyPrice=+pBuy.value;if(!sym||!amount||!buyPrice)return;p.push({symbol:sym,amount,buyPrice});localStorage.setItem("portfolio",JSON.stringify(p));renderPortfolio()}
function delPos(i){const p=JSON.parse(localStorage.getItem("portfolio")||"[]");p.splice(i,1);localStorage.setItem("portfolio",JSON.stringify(p));renderPortfolio()}
async function fetchGlobal(){try{const d=(await fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json())).data||{};stMcap.textContent=fmt((d.total_market_cap||{}).usd||0);stBtc.textContent=`${((d.market_cap_percentage||{}).btc||0).toFixed(1)}%`;stVol.textContent=fmt((d.total_volume||{}).usd||0);stCoins.textContent=(d.active_cryptocurrencies||"—")}catch(e){}}
function bindTabs(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(b.dataset.tab).classList.add("active");document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));document.querySelectorAll(`[data-tab='${b.dataset.tab}']`).forEach(x=>x.classList.add("active"))})}
document.querySelectorAll(".f").forEach(b=>b.onclick=()=>{document.querySelectorAll(".f").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;renderMarket()});
document.querySelectorAll(".nf").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nf").forEach(x=>x.classList.remove("active"));b.classList.add("active");newsFilter=b.dataset.nf;renderNews()});
document.querySelectorAll(".preset").forEach(b=>b.onclick=()=>applyPreset(b.dataset.p));
search.oninput=renderMarket;
