<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRYPTO_BOT Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#0b1020;--card:#131a2c;--muted:#8a93a5;--text:#edf2ff;--ok:#00d084;--bad:#ff5c7a;--warn:#ffbe3d}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .tab{padding:10px 14px;border:1px solid #27304a;background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
    .tab.active{border-color:var(--ok);color:var(--ok)}
    .page{display:none}.page.active{display:block}
    .card{background:var(--card);border:1px solid #27304a;border-radius:14px;padding:12px;margin-bottom:10px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    input,select,button{background:#0d1425;border:1px solid #2a3452;color:var(--text);padding:8px 10px;border-radius:10px}
    button{cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
    .muted{color:var(--muted);font-size:12px}
    .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>CRYPTO_BOT Web Panel</h2>
    <div class="tabs">
      <button class="tab active" onclick="showTab('market',this)">📈 Market</button>
      <button class="tab" onclick="showTab('screener',this)">🆕 Screener</button>
      <button class="tab" onclick="showTab('sniper',this)">🎯 Sniper</button>
      <button class="tab" onclick="showTab('check',this)">🛡 Scam Check</button>
    </div>

    <section id="market" class="page active">
      <div class="card">
        <div class="row">
          <input id="symbolInput" placeholder="BTC">
          <button onclick="loadCoin()">Загрузить график</button>
          <span id="coinInfo" class="muted">—</span>
        </div>
      </div>
      <div class="card"><canvas id="chart" height="120"></canvas></div>
    </section>

    <section id="screener" class="page">
      <div class="card row">
        <label>Age ≤ hours <input id="ageHours" type="number" value="24" min="1" max="48"></label>
        <button onclick="loadScreener()">Сканировать</button>
      </div>
      <div id="screenerList" class="grid"></div>
    </section>

    <section id="sniper" class="page">
      <div class="card row">
        <button onclick="loadSniper()">Поиск токенов первых минут</button>
        <span class="muted">Фильтр: LP lock, renounced, tax 0%, no honeypot (если данные доступны).</span>
      </div>
      <div id="sniperList" class="grid"></div>
    </section>

    <section id="check" class="page">
      <div class="card row">
        <select id="chainSel"><option>ethereum</option><option>bsc</option><option>base</option><option>arbitrum</option></select>
        <input id="contractInput" placeholder="0x...">
        <button onclick="checkContract()">Проверить</button>
      </div>
      <div id="checkResult" class="card muted">Введите контракт для проверки.</div>
    </section>
  </div>

  <script>
    let chartRef = null;
    function showTab(id, el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
    const fmt=n=>n>=1e9?`$${(n/1e9).toFixed(2)}B`:n>=1e6?`$${(n/1e6).toFixed(2)}M`:n>=1e3?`$${(n/1e3).toFixed(1)}K`:`$${(+n||0).toFixed(2)}`

    async function loadCoin(){
      const s=(document.getElementById('symbolInput').value||'BTC').toLowerCase();
      const search=await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(s)}`).then(r=>r.json());
      const id=search.coins?.[0]?.id; if(!id){document.getElementById('coinInfo').textContent='Не найдено'; return;}
      const data=await fetch(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=30`).then(r=>r.json());
      const pts=(data.prices||[]); document.getElementById('coinInfo').textContent=`${id} · ${pts.length} точек`;
      const labels=pts.map(p=>new Date(p[0]).toLocaleDateString()); const vals=pts.map(p=>p[1]);
      const ctx=document.getElementById('chart').getContext('2d'); if(chartRef) chartRef.destroy();
      chartRef=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:'#00d084',pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false}}}});
    }

    async function getDexRows(){
      const profiles=await fetch('https://api.dexscreener.com/token-profiles/latest/v1').then(r=>r.json()).catch(()=>[]);
      const out=[];
      for(const p of (profiles||[]).slice(0,120)){
        const c=p.tokenAddress; if(!c) continue;
        const d=await fetch(`https://api.dexscreener.com/latest/dex/tokens/${c}`).then(r=>r.json()).catch(()=>null);
        const pairs=d?.pairs||[]; if(!pairs.length) continue;
        const best=pairs.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];
        if(!best) continue;
        out.push({
          name:best.baseToken?.name||'Unknown',symbol:best.baseToken?.symbol||'UNK',chain:best.chainId,
          age:Math.max(0,(Date.now()-(best.pairCreatedAt||Date.now()))/3600000),liq:+(best.liquidity?.usd||0),
          mcap:+(best.marketCap||best.fdv||0),v24:+(best.volume?.h24||0),v1:+(best.volume?.h1||0),url:best.url||'#'
        });
      }
      return out;
    }

    function drawCards(target, rows){
      document.getElementById(target).innerHTML=rows.map(r=>`<div class="card">
        <b>${r.name} (${r.symbol})</b><div class="muted">${r.chain} · age ${r.age.toFixed(2)}h</div>
        <div>💧 ${fmt(r.liq)} | 💰 ${fmt(r.mcap)} | 📊 ${fmt(r.v24)}</div>
        <div class="${r.liq>=50000?'ok':'bad'}">Filter: liq ${r.liq>=50000?'OK':'LOW'}</div>
        <a href="${r.url}" target="_blank">DexScreener</a>
      </div>`).join('');
    }

    async function loadScreener(){
      const age=+document.getElementById('ageHours').value||24;
      let rows=await getDexRows();
      rows=rows.filter(x=>x.age<=age && x.liq>=50000).slice(0,20);
      drawCards('screenerList', rows);
    }

    async function loadSniper(){
      let rows=await getDexRows();
      rows=rows.filter(x=>x.age<=0.5 && x.liq>=50000).slice(0,15).map(x=>({...x,risk:Math.max(0,100-Math.min(80,(x.liq/2000))) }));
      document.getElementById('sniperList').innerHTML=rows.map(r=>`<div class="card">
        <b>${r.name} (${r.symbol})</b><div class="muted">${r.chain} · ${Math.round(r.age*60)} min</div>
        <div>Risk ${Math.round(r.risk)}/100</div>
        <div class="${r.risk<35?'ok':r.risk<60?'warn':'bad'}">${r.risk<35?'LOW':'MED/HIGH'} RISK</div>
        <a href="${r.url}" target="_blank">Открыть пару</a>
      </div>`).join('');
    }

    async function checkContract(){
      const chain=document.getElementById('chainSel').value;
      const c=document.getElementById('contractInput').value.trim();
      if(!c) return;
      const chainMap={ethereum:'1',bsc:'56',base:'8453',arbitrum:'42161'};
      const data=await fetch(`https://api.gopluslabs.io/api/v1/token_security/${chainMap[chain]}?contract_addresses=${c}`).then(r=>r.json()).catch(()=>null);
      const item=(data?.result?.[c.toLowerCase()])||(data?.result?.[c])||Object.values(data?.result||{})[0]||{};
      document.getElementById('checkResult').innerHTML=`<b>Scam Check</b><br>
        Honeypot: ${item.is_honeypot==='1'?'ДА':'НЕТ'}<br>
        Mint: ${item.is_mintable==='1'?'ДА':'НЕТ'}<br>
        Blacklist: ${item.is_blacklisted==='1'?'ДА':'НЕТ'}<br>
        Tax: ${(item.buy_tax||'N/A')}% / ${(item.sell_tax||'N/A')}%<br>
        Open source: ${item.is_open_source==='1'?'ДА':'НЕТ'}`;
    }

    loadCoin();
  </script>
</body>
</html>
