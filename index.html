<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Dashboard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#060810; --card:#0d1120; --line:#1a2035; --txt:#edf1ff; --muted:#94a0bf; --g:#00ff88; --b:#00c8ff; --r:#ff2d55; --y:#ffcc00; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui}
    h1,h2,h3{font-family:"Unbounded",sans-serif}
    .mono{font-family:"JetBrains Mono",monospace}
    .app{max-width:1300px;margin:auto;padding:16px 16px 80px}
    .tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:linear-gradient(var(--bg),rgba(6,8,16,.75));padding:8px 0;z-index:3}
    .tabs button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:999px}
    .tabs button.active{background:var(--g);border-color:var(--g);color:#041008}
    .page{display:none}.page.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
    .coin{background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,select,button{background:#0a1020;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:10px}
    .ok{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}
    .status{position:fixed;bottom:0;left:0;right:0;background:rgba(6,8,16,.95);border-top:1px solid var(--line);padding:9px 12px;color:var(--muted);font-size:12px;text-align:center}
    canvas{max-height:260px}
  </style>
</head>
<body>
<div class="app">
  <h1>Крипто Дашборд</h1>
  <div class="tabs" id="tabs">
    <button class="active" data-tab="market">📊 Рынок</button>
    <button data-tab="signals">🎯 Сигналы</button>
    <button data-tab="social">📡 Соц. Сигналы</button>
    <button data-tab="screener">🔍 Скринер</button>
    <button data-tab="scam">🚨 Скам</button>
    <button data-tab="news">📰 Новости</button>
    <button data-tab="portfolio">💼 Портфолио</button>
  </div>

  <section id="market" class="page active">
    <div class="card row"><input id="q" placeholder="Поиск"><button id="load">Обновить</button></div>
    <div id="marketGrid" class="grid"></div>
    <div class="card">
      <canvas id="chart"></canvas>
      <div class="row">
        <button data-days="1" class="d">1д</button><button data-days="7" class="d">7д</button><button data-days="30" class="d">30д</button><button data-days="90" class="d">90д</button>
      </div>
      <div id="rsi"></div>
    </div>
  </section>
  <section id="signals" class="page"><div id="signalsGrid" class="grid"></div></section>
  <section id="social" class="page"><div id="socialGrid" class="grid"></div></section>
  <section id="screener" class="page"><div class="card row"><select id="sSig"><option value="all">Все</option><option value="buy">Buy</option><option value="sell">Sell</option></select><input id="sMin" type="number" placeholder="RSI min"><input id="sMax" type="number" placeholder="RSI max"><button id="runScr">Сканировать</button></div><div id="scrGrid" class="grid"></div></section>
  <section id="scam" class="page"><div id="scamGrid" class="grid"></div></section>
  <section id="news" class="page"><div id="newsList" class="card"></div></section>
  <section id="portfolio" class="page"><div class="card row"><input id="ps" placeholder="SYMBOL"><input id="pa" type="number" step="any" placeholder="Amount"><input id="pp" type="number" step="any" placeholder="Buy"><button id="addPos">Добавить</button></div><div id="pf" class="grid"></div></section>
</div>
<div class="status" id="status">Загрузка...</div>

<script>
let rows=[], chart, selected=null, pf=JSON.parse(localStorage.getItem('pf')||'[]');
const fmt=n=>n==null?'—':(n>1e9?`$${(n/1e9).toFixed(2)}B`:n>1e6?`$${(n/1e6).toFixed(2)}M`:n>1e3?`$${(n/1e3).toFixed(2)}K`:n>1?`$${n.toFixed(4)}`:`$${n.toFixed(8)}`);
const rsi=p=>{if(!p||p.length<15)return 50;let g=0,l=0;for(let i=1;i<=14;i++){const d=p[i]-p[i-1];if(d>0)g+=d;else l-=d;}g/=14;l/=14;for(let i=15;i<p.length;i++){const d=p[i]-p[i-1];g=(g*13+Math.max(d,0))/14;l=(l*13+Math.max(-d,0))/14;}if(!l)return 100;const rs=g/l;return 100-100/(1+rs)};
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
function st(t){document.getElementById('status').textContent=t;}
function coin(c){const cls=(c._rsi<35?'ok':c._rsi>70?'bad':'warn');return `<div class="coin"><b>${c.symbol.toUpperCase()}</b> <span class="mono">#${c.market_cap_rank||'—'}</span><div>${c.name}</div><div class="mono">${fmt(c.current_price)}</div><div class="${c.price_change_percentage_24h>=0?'ok':'bad'}">24ч ${c.price_change_percentage_24h.toFixed(2)}%</div><div class="${cls}">RSI ${c._rsi.toFixed(0)}</div><button data-id="${c.id}" class="open">График</button></div>`}
async function load(){st('Обновляю рынок...');rows=(await j('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=true&price_change_percentage=24h,7d')).map(x=>({...x,_rsi:rsi((x.sparkline_in_7d||{}).price||[])}));render();social();signals();scam();news();portfolio();st(`Монет: ${rows.length} · автообновление 90с`);}
function render(){const q=(document.getElementById('q').value||'').toLowerCase();const list=rows.filter(x=>!q||x.symbol.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).slice(0,250);document.getElementById('marketGrid').innerHTML=list.map(coin).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openCoin(b.dataset.id));}
function signals(){const arr=rows.filter(x=>x._rsi<35||x._rsi>70).slice(0,30);document.getElementById('signalsGrid').innerHTML=arr.map(x=>`<div class="coin"><b>${x.symbol.toUpperCase()}</b><div>${x._rsi<35?'🟢 BUY':'🔴 SELL'} | RSI ${x._rsi.toFixed(0)}</div><div>Вход ${fmt(x.current_price)} | Стоп ${fmt(x.current_price*0.93)} | TP ${fmt(x.current_price*1.12)}</div></div>`).join('');}
function social(){const arr=rows.filter(x=>x.market_cap<50e6&&x.price_change_percentage_24h>8).sort((a,b)=>b.price_change_percentage_24h-a.price_change_percentage_24h).slice(0,12);document.getElementById('socialGrid').innerHTML=arr.map((x,i)=>`<div class="coin"><b>${x.symbol.toUpperCase()}</b><div>Social score: ${Math.min(99,50+Math.round(x.price_change_percentage_24h/2)+(x.market_cap<1e7?20:8))}</div><div>Reddit mentions: ${2+i%9}</div><div>Trending badge: ${i<4?'✅ CoinGecko':'—'}</div><div>Потенциал: ${x.market_cap<1e7?'x20-x100':'x5-x20'}</div></div>`).join('');}
function scam(){const arr=rows.filter(x=>x.market_cap>1e7&&x.price_change_percentage_24h<-8&&x.total_volume/x.market_cap>0.15).sort((a,b)=>(b.total_volume/b.market_cap)-(a.total_volume/a.market_cap)).slice(0,20);document.getElementById('scamGrid').innerHTML=arr.map(x=>`<div class="coin"><b class="bad">${x.symbol.toUpperCase()}</b><div>Риск: ${Math.min(99,50+Math.round((x.total_volume/x.market_cap)*120))}/100</div><div>Капа ${fmt(x.market_cap)} | Объём ${fmt(x.total_volume)}</div><div>Vol/MCap ${(x.total_volume/x.market_cap*100).toFixed(1)}%</div><div>7д ${x.price_change_percentage_7d_in_currency.toFixed(2)}% | 24ч ${x.price_change_percentage_24h.toFixed(2)}%</div></div>`).join('')||'<div class="card">Сильных скам-паттернов нет.</div>';}
async function news(){try{const d=await j('https://min-api.cryptocompare.com/data/v2/news/?lang=RU');document.getElementById('newsList').innerHTML=(d.Data||[]).slice(0,20).map(n=>`<div><a href="${n.url}" target="_blank" style="color:#edf1ff">${n.title}</a></div>`).join('<hr style="border-color:#1a2035">');}catch{document.getElementById('newsList').textContent='Новости временно недоступны';}}
function portfolio(){const map={};rows.forEach(x=>map[x.symbol.toUpperCase()]=x.current_price);document.getElementById('pf').innerHTML=pf.map((x,i)=>{const cur=map[x.s]||x.p,pnl=(cur-x.p)*x.a;return `<div class="coin"><b>${x.s}</b><div>${x.a}</div><div>Текущая ${fmt(cur)}</div><div class="${pnl>=0?'ok':'bad'}">PnL ${fmt(pnl)}</div><button data-i="${i}" class="del">Удалить</button></div>`}).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{pf.splice(+b.dataset.i,1);localStorage.setItem('pf',JSON.stringify(pf));portfolio();});}
async function openCoin(id,days=30){selected=id;const d=await j(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=${days}`);const p=(d.prices||[]).map(x=>x[1]);const labels=(d.prices||[]).map(x=>new Date(x[0]).toLocaleDateString('ru-RU'));const ctx=document.getElementById('chart').getContext('2d');if(chart)chart.destroy();const bull=(p[p.length-1]||0)>=(p[0]||0);const c=bull?'#00ff88':'#ff2d55';const g=ctx.createLinearGradient(0,0,0,260);g.addColorStop(0,bull?'rgba(0,255,136,.35)':'rgba(255,45,85,.35)');g.addColorStop(1,'transparent');chart=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:p,borderColor:c,backgroundColor:g,fill:true,pointRadius:0,tension:.25}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:'#94a0bf'}}}}});const v=rsi(p);document.getElementById('rsi').innerHTML=`RSI gauge: <span class="${v<35?'ok':v>70?'bad':'warn'}">${v.toFixed(1)}</span>`;}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active');});
document.getElementById('q').oninput=render;document.getElementById('load').onclick=load;document.querySelectorAll('.d').forEach(b=>b.onclick=()=>selected&&openCoin(selected,+b.dataset.days));
document.getElementById('runScr').onclick=()=>{const mn=+document.getElementById('sMin').value||0,mx=+document.getElementById('sMax').value||100,s=document.getElementById('sSig').value;const arr=rows.filter(x=>x._rsi>=mn&&x._rsi<=mx&&(s==='all'||(s==='buy'&&x._rsi<35)||(s==='sell'&&x._rsi>70))).slice(0,120);document.getElementById('scrGrid').innerHTML=arr.map(coin).join('');};
document.getElementById('addPos').onclick=()=>{const s=(document.getElementById('ps').value||'').toUpperCase(),a=+document.getElementById('pa').value,p=+document.getElementById('pp').value;if(!s||!a||!p)return;pf.push({s,a,p});localStorage.setItem('pf',JSON.stringify(pf));portfolio();};
load();setInterval(load,90000);
</script>
</body>
</html>
