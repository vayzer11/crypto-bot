<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Крипто-дашборд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #060810;
      --card: #0d1120;
      --line: #1a2235;
      --txt: #e8f0ff;
      --muted: #7a8aa8;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.15);
      --bad: #ff4d6d;
      --warn: #ffcc00;
      --radius: 14px;
      --transition: 0.25s ease;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }
    h1, h2, h3, .font-head {
      font-family: "Unbounded", system-ui, sans-serif;
      font-weight: 600;
    }
    .mono { font-family: "JetBrains Mono", monospace; }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 88px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.35rem;
      margin: 0;
      letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    nav.tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, var(--bg) 70%, transparent);
      -webkit-overflow-scrolling: touch;
    }
    nav.tabs button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color var(--transition), color var(--transition), background var(--transition), transform 0.15s;
    }
    nav.tabs button:hover {
      color: var(--txt);
      border-color: var(--accent);
    }
    nav.tabs button.active {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .page { display: none; animation: fadeIn 0.35s ease; }
    .page.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    input, select, button.btn {
      border: 1px solid var(--line);
      background: #080c18;
      color: var(--txt);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    button.btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: filter var(--transition);
    }
    button.btn-primary:hover { filter: brightness(1.08); }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #080c18;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition);
    }
    .pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .coin-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: linear-gradient(145deg, #0d1120 0%, #0a0e18 100%);
      cursor: pointer;
      transition: border-color var(--transition), transform 0.2s;
    }
    .coin-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .coin-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .coin-head img { width: 36px; height: 36px; border-radius: 50%; }
    .coin-meta { flex: 1; min-width: 0; }
    .coin-meta .sym { font-weight: 700; font-size: 1rem; }
    .coin-meta .name { color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 4px;
      margin-right: 4px;
    }
    .badge-buy { background: rgba(0, 255, 136, 0.2); color: var(--accent); }
    .badge-sell { background: rgba(255, 77, 109, 0.2); color: var(--bad); }
    .badge-wait { background: rgba(255, 204, 0, 0.15); color: var(--warn); }
    .badge-rsi-o { background: rgba(255, 77, 109, 0.2); color: #ff8899; }
    .badge-rsi-u { background: rgba(0, 255, 136, 0.2); color: #66ffbb; }
    .badge-rsi-n { background: rgba(122, 138, 168, 0.25); color: var(--muted); }

    .price-line { font-family: "JetBrains Mono", monospace; font-size: 1.05rem; }
    .chg { font-size: 0.85rem; font-weight: 600; }
    .chg.up { color: var(--accent); }
    .chg.down { color: var(--bad); }

    .rsi-bar-wrap {
      margin-top: 10px;
      height: 8px;
      background: #1a2235;
      border-radius: 6px;
      overflow: hidden;
    }
    .rsi-bar {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease;
    }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .detail-back {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .chart-wrap { position: relative; height: 260px; margin-top: 8px; }
    .period-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .period-btns button {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #080c18;
      color: var(--muted);
      cursor: pointer;
    }
    .period-btns button.active { border-color: var(--accent); color: var(--accent); }

    .section-title {
      font-family: "Unbounded", sans-serif;
      font-size: 1rem;
      margin: 20px 0 12px;
      color: var(--accent);
    }

    .signal-section { border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
    .signal-buy { border: 1px solid rgba(0, 255, 136, 0.35); background: rgba(0, 255, 136, 0.06); }
    .signal-sell { border: 1px solid rgba(255, 77, 109, 0.35); background: rgba(255, 77, 109, 0.06); }

    .news-item {
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
    }
    .news-item:last-child { border-bottom: none; }
    .muted { color: var(--muted); font-size: 0.82rem; }

    .risk-high { color: var(--bad); }
    .risk-mid { color: var(--warn); }
    .risk-low { color: var(--accent); }

    footer.status {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px;
      background: rgba(6, 8, 16, 0.92);
      border-top: 1px solid var(--line);
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="font-head"><span class="live-dot"></span>Крипто<span>дашборд</span></h1>
    <div class="mono muted" id="clock">—</div>
  </header>

  <nav class="tabs" id="tabNav">
    <button type="button" class="tab active" data-tab="market">📊 Рынок</button>
    <button type="button" class="tab" data-tab="signals">🎯 Сигналы</button>
    <button type="button" class="tab" data-tab="screener">🔍 Скринер</button>
    <button type="button" class="tab" data-tab="scam">🚨 Скам</button>
    <button type="button" class="tab" data-tab="news">📰 Новости</button>
    <button type="button" class="tab" data-tab="portfolio">💼 Портфолио</button>
  </nav>

  <!-- Рынок -->
  <section id="page-market" class="page active">
    <div id="market-list-view">
      <div class="search-row">
        <input type="search" id="marketSearch" placeholder="Поиск монеты..." style="flex:1;min-width:200px">
      </div>
      <div class="pills" id="marketPills">
        <button type="button" class="pill active" data-filter="all">Все</button>
        <button type="button" class="pill" data-filter="buy">Купить</button>
        <button type="button" class="pill" data-filter="sell">Продать</button>
        <button type="button" class="pill" data-filter="wait">Ждать</button>
        <button type="button" class="pill" data-filter="ob">Перекуплен</button>
        <button type="button" class="pill" data-filter="os">Перепродан</button>
      </div>
      <div class="grid" id="marketGrid"></div>
    </div>
    <div id="market-detail-view" style="display:none">
      <div class="card">
        <div class="detail-header">
          <button type="button" class="detail-back" id="marketBack">← Назад</button>
          <div id="detailTitle"></div>
        </div>
        <div id="detailRsi"></div>
        <div class="period-btns" id="periodBtns">
          <button type="button" data-days="1">1д</button>
          <button type="button" data-days="7">7д</button>
          <button type="button" data-days="30" class="active">30д</button>
          <button type="button" data-days="90">90д</button>
        </div>
        <div class="chart-wrap"><canvas id="detailChart"></canvas></div>
        <div id="detailAnalysis" class="mono muted" style="margin-top:12px;font-size:0.85rem;line-height:1.5"></div>
      </div>
    </div>
  </section>

  <!-- Сигналы -->
  <section id="page-signals" class="page">
    <div class="signal-section signal-buy">
      <h3 class="section-title" style="margin-top:0">Покупка (RSI &lt; 35)</h3>
      <div class="grid" id="buySignals"></div>
    </div>
    <div class="signal-section signal-sell">
      <h3 class="section-title" style="margin-top:0;color:var(--bad)">Продажа (RSI &gt; 70)</h3>
      <div class="grid" id="sellSignals"></div>
    </div>
  </section>

  <!-- Скринер -->
  <section id="page-screener" class="page">
    <div class="card">
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
        <label>Тип сигнала
          <select id="scrSignal">
            <option value="all">Все</option>
            <option value="buy">Купить</option>
            <option value="sell">Продать</option>
            <option value="wait">Ждать</option>
          </select>
        </label>
        <label>RSI мин <input type="number" id="scrRsiMin" value="0" min="0" max="100"></label>
        <label>RSI макс <input type="number" id="scrRsiMax" value="100" min="0" max="100"></label>
        <label>24ч % мин <input type="number" id="scrChgMin" value="-100" step="0.1"></label>
        <label>24ч % макс <input type="number" id="scrChgMax" value="100" step="0.1"></label>
        <label>Vol/MCap мин % <input type="number" id="scrVmMin" value="0" step="0.1"></label>
        <label>Сортировка
          <select id="scrSort">
            <option value="rank">Ранг</option>
            <option value="rsi">RSI</option>
            <option value="chg">24ч %</option>
            <option value="vm">Vol/MCap</option>
          </select>
        </label>
      </div>
      <button type="button" class="btn btn-primary" id="scrRun" style="margin-top:12px">Запустить</button>
    </div>
    <div class="grid" id="screenerGrid"></div>
  </section>

  <!-- Скам -->
  <section id="page-scam" class="page">
    <div class="card">
      <h2 class="font-head" style="margin-top:0;font-size:1rem">Сканер подозрительных пар</h2>
      <p class="muted">Автозагрузка пар с DexScreener (ликвидность &gt; $5k, возраст &lt; 48ч). Оценка риска по соотношению объёма к капе, волатильности и эвристикам «насоса».</p>
      <button type="button" class="btn btn-primary" id="scamReload">Обновить</button>
    </div>
    <div class="grid" id="scamGrid"></div>
  </section>

  <!-- Новости -->
  <section id="page-news" class="page">
    <div id="newsList" class="card"></div>
  </section>

  <!-- Портфолио -->
  <section id="page-portfolio" class="page">
    <div class="card">
      <h3 class="font-head" style="margin-top:0">Добавить позицию</h3>
      <div class="search-row">
        <input id="pfSym" placeholder="Символ (BTC)">
        <input id="pfAmt" type="number" step="any" placeholder="Количество">
        <input id="pfBuy" type="number" step="any" placeholder="Цена покупки $">
        <input id="pfNote" placeholder="Заметка">
        <button type="button" class="btn btn-primary" id="pfAdd">Добавить</button>
      </div>
    </div>
    <div class="card mono" id="pfSummary">Итого: —</div>
    <div class="grid" id="pfList"></div>
  </section>
</div>

<footer class="status" id="footerStatus">Загрузка…</footer>

<script>
(function () {
  const ACCENT = '#00ff88';
  const BAD = '#ff4d6d';
  const WARN = '#ffcc00';

  let marketData = [];
  let detailChart = null;
  let detailCoinId = null;
  let marketFilter = 'all';
  let searchQ = '';

  function setStatus(t) {
    const el = document.getElementById('footerStatus');
    if (el) el.textContent = t;
  }

  function fmtUsd(n) {
    if (n == null || isNaN(n)) return '—';
    const x = +n;
    if (x >= 1e12) return '$' + (x / 1e12).toFixed(2) + 'T';
    if (x >= 1e9) return '$' + (x / 1e9).toFixed(2) + 'B';
    if (x >= 1e6) return '$' + (x / 1e6).toFixed(2) + 'M';
    if (x >= 1e3) return '$' + (x / 1e3).toFixed(2) + 'K';
    if (x >= 1) return '$' + x.toLocaleString('ru-RU', { maximumFractionDigits: 4 });
    return '$' + x.toFixed(8);
  }

  function calcRsi(prices, period = 14) {
    if (!prices || prices.length < period + 1) return 50;
    const deltas = [];
    for (let i = 1; i < prices.length; i++) deltas.push(prices[i] - prices[i - 1]);
    let avgGain = 0, avgLoss = 0;
    for (let i = 0; i < period; i++) {
      avgGain += Math.max(deltas[i], 0);
      avgLoss += Math.abs(Math.min(deltas[i], 0));
    }
    avgGain /= period;
    avgLoss /= period;
    for (let i = period; i < deltas.length; i++) {
      avgGain = (avgGain * (period - 1) + Math.max(deltas[i], 0)) / period;
      avgLoss = (avgLoss * (period - 1) + Math.abs(Math.min(deltas[i], 0))) / period;
    }
    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return Math.round((100 - 100 / (1 + rs)) * 100) / 100;
  }

  function signalFromRsi(rsi) {
    if (rsi < 35) return { key: 'buy', label: 'КУПИТЬ', cls: 'badge-buy' };
    if (rsi > 70) return { key: 'sell', label: 'ПРОДАТЬ', cls: 'badge-sell' };
    return { key: 'wait', label: 'ЖДАТЬ', cls: 'badge-wait' };
  }

  function rsiBadgeClass(rsi) {
    if (rsi < 30) return 'badge-rsi-u';
    if (rsi > 70) return 'badge-rsi-o';
    return 'badge-rsi-n';
  }

  function enrichCoin(c) {
    const spark = (c.sparkline_in_7d && c.sparkline_in_7d.price) || [];
    const rsi = calcRsi(spark);
    const sig = signalFromRsi(rsi);
    const mcap = +c.market_cap || 0;
    const vol = +c.total_volume || 0;
    const vm = mcap > 0 ? (vol / mcap) * 100 : 0;
    const chg = +c.price_change_percentage_24h || 0;
    return { ...c, _rsi: rsi, _sig: sig, _vm: vm, _chg: chg };
  }

  async function fetchJson(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function loadMarket() {
    try {
      const rows = await fetchJson(
        'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=true&price_change_percentage=24h'
      );
      marketData = (rows || []).map(enrichCoin);
      setStatus('Рынок: ' + marketData.length + ' монет · CoinGecko');
      renderMarket();
      renderSignals();
    } catch (e) {
      console.error(e);
      setStatus('Ошибка рынка: ' + (e.message || e));
    }
  }

  function passesFilter(c) {
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!((c.symbol || '').toLowerCase().includes(q) || (c.name || '').toLowerCase().includes(q))) return false;
    }
    const rsi = c._rsi;
    const sig = c._sig.key;
    if (marketFilter === 'buy') return sig === 'buy';
    if (marketFilter === 'sell') return sig === 'sell';
    if (marketFilter === 'wait') return sig === 'wait';
    if (marketFilter === 'ob') return rsi > 70;
    if (marketFilter === 'os') return rsi < 30;
    return true;
  }

  function renderMarket() {
    const grid = document.getElementById('marketGrid');
    const list = marketData.filter(passesFilter).slice(0, 120);
    grid.innerHTML = list.map(c => coinCardHtml(c, true)).join('');
    grid.querySelectorAll('.coin-card').forEach((el, i) => {
      el.addEventListener('click', () => openDetail(list[i].id));
    });
  }

  function coinCardHtml(c, click) {
    const chg = c._chg;
    const chgCls = chg >= 0 ? 'up' : 'down';
    const rsi = c._rsi;
    const barW = Math.max(3, Math.min(100, rsi));
    let barColor = WARN;
    if (rsi < 30) barColor = ACCENT;
    else if (rsi > 70) barColor = BAD;

    return `
      <div class="coin-card" data-id="${c.id}">
        <div class="coin-head">
          <img src="${c.image || ''}" alt="" width="36" height="36" loading="lazy">
          <div class="coin-meta">
            <div class="sym">${c.symbol.toUpperCase()}</div>
            <div class="name">#${c.market_cap_rank || '—'} · ${c.name}</div>
            <span class="badge ${c._sig.cls}">${c._sig.label}</span>
            <span class="badge ${rsiBadgeClass(rsi)}">RSI ${rsi.toFixed(0)}</span>
          </div>
        </div>
        <div class="price-line">${fmtUsd(c.current_price)}</div>
        <div class="chg ${chgCls}">24ч: ${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</div>
        <div class="muted mono" style="margin-top:6px;font-size:0.75rem">Vol/MCap: ${c._vm.toFixed(1)}%</div>
        <div class="rsi-bar-wrap"><div class="rsi-bar" style="width:${barW}%;background:${barColor}"></div></div>
      </div>`;
  }

  function renderSignals() {
    const buys = marketData.filter(c => c._rsi < 35).slice(0, 24);
    const sells = marketData.filter(c => c._rsi > 70).slice(0, 24);
    const mk = (c) => {
      const entry = +c.current_price || 0;
      const stop = entry * 0.93;
      const tp = entry * 1.08;
      return `
        <div class="coin-card" style="cursor:default">
          <div class="coin-head">
            <img src="${c.image || ''}" alt="" width="36" height="36" loading="lazy">
            <div class="coin-meta">
              <div class="sym">${c.symbol.toUpperCase()}</div>
              <div class="name">${c.name}</div>
              <span class="badge ${rsiBadgeClass(c._rsi)}">RSI ${c._rsi.toFixed(0)}</span>
            </div>
          </div>
          <div class="price-line">${fmtUsd(entry)}</div>
          <div class="mono muted" style="margin-top:8px;font-size:0.8rem">
            Вход ~ ${fmtUsd(entry)}<br>
            Стоп ${fmtUsd(stop)} · TP ${fmtUsd(tp)}
          </div>
        </div>`;
    };
    document.getElementById('buySignals').innerHTML = buys.length ? buys.map(mk).join('') : '<p class="muted">Нет сигналов в текущей выборке.</p>';
    document.getElementById('sellSignals').innerHTML = sells.length ? sells.map(mk).join('') : '<p class="muted">Нет сигналов.</p>';
  }

  async function openDetail(coinId) {
    detailCoinId = coinId;
    document.getElementById('market-list-view').style.display = 'none';
    document.getElementById('market-detail-view').style.display = 'block';
    const c = marketData.find(x => x.id === coinId);
    if (!c) return;
    document.getElementById('detailTitle').innerHTML = `
      <h2 class="font-head" style="margin:0">${c.name} <span class="mono" style="color:var(--accent)">${c.symbol.toUpperCase()}</span></h2>
      <div class="price-line">${fmtUsd(c.current_price)}</div>`;
    const rsi = c._rsi;
    document.getElementById('detailRsi').innerHTML = `
      <p>RSI(14): <strong class="mono">${rsi.toFixed(1)}</strong></p>
      <div class="rsi-bar-wrap" style="height:10px"><div class="rsi-bar" style="width:${Math.min(100, rsi)}%;background:${rsi > 70 ? BAD : rsi < 30 ? ACCENT : WARN}"></div></div>`;
    document.getElementById('detailAnalysis').textContent =
      `Капитализация ${fmtUsd(c.market_cap)} · Объём 24ч ${fmtUsd(c.total_volume)} · Сигнал: ${c._sig.label}`;
    await loadDetailChart(30);
  }

  document.getElementById('marketBack').addEventListener('click', () => {
    document.getElementById('market-detail-view').style.display = 'none';
    document.getElementById('market-list-view').style.display = 'block';
    if (detailChart) { detailChart.destroy(); detailChart = null; }
  });

  async function loadDetailChart(days) {
    if (!detailCoinId) return;
    try {
      const d = await fetchJson(
        `https://api.coingecko.com/api/v3/coins/${detailCoinId}/market_chart?vs_currency=usd&days=${days}`
      );
      const pts = (d.prices || []).map(x => x[1]);
      const labels = (d.prices || []).map(x => new Date(x[0]).toLocaleDateString('ru-RU'));
      const last = pts[pts.length - 1] || 0;
      const first = pts[0] || last;
      const bullish = last >= first;
      const lineColor = bullish ? ACCENT : BAD;
      const ctx = document.getElementById('detailChart').getContext('2d');
      if (detailChart) detailChart.destroy();
      const grad = ctx.createLinearGradient(0, 0, 0, 240);
      grad.addColorStop(0, bullish ? 'rgba(0,255,136,0.35)' : 'rgba(255,77,109,0.3)');
      grad.addColorStop(1, 'transparent');
      detailChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: pts,
            borderColor: lineColor,
            backgroundColor: grad,
            fill: true,
            tension: 0.25,
            pointRadius: 0,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { ticks: { color: '#7a8aa8', font: { family: 'JetBrains Mono' } }, grid: { color: '#1a2235' } }
          }
        }
      });
    } catch (e) {
      console.error(e);
    }
  }

  document.querySelectorAll('#periodBtns button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#periodBtns button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadDetailChart(+btn.dataset.days);
    });
  });

  document.querySelectorAll('#marketPills .pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('#marketPills .pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      marketFilter = p.dataset.filter;
      renderMarket();
    });
  });

  document.getElementById('marketSearch').addEventListener('input', e => {
    searchQ = e.target.value.trim();
    renderMarket();
  });

  function runScreener() {
    const sig = document.getElementById('scrSignal').value;
    const rmin = +document.getElementById('scrRsiMin').value || 0;
    const rmax = +document.getElementById('scrRsiMax').value || 100;
    const cmin = +document.getElementById('scrChgMin').value;
    const cmax = +document.getElementById('scrChgMax').value;
    const vmMin = +document.getElementById('scrVmMin').value || 0;
    const sort = document.getElementById('scrSort').value;

    let rows = marketData.filter(c => {
      if (c._rsi < rmin || c._rsi > rmax) return false;
      if (c._chg < cmin || c._chg > cmax) return false;
      if (c._vm < vmMin) return false;
      if (sig !== 'all' && c._sig.key !== sig) return false;
      return true;
    });

    if (sort === 'rank') rows.sort((a, b) => (a.market_cap_rank || 9999) - (b.market_cap_rank || 9999));
    if (sort === 'rsi') rows.sort((a, b) => b._rsi - a._rsi);
    if (sort === 'chg') rows.sort((a, b) => b._chg - a._chg);
    if (sort === 'vm') rows.sort((a, b) => b._vm - a._vm);

    document.getElementById('screenerGrid').innerHTML = rows.slice(0, 60).map(c => coinCardHtml(c, true)).join('');
  }

  document.getElementById('scrRun').addEventListener('click', runScreener);

  const CHAINS = new Set(['ethereum', 'bsc', 'solana', 'base', 'arbitrum', 'polygon']);

  async function loadScam() {
    const grid = document.getElementById('scamGrid');
    grid.innerHTML = '<p class="muted">Загрузка DexScreener…</p>';
    try {
      const queries = ['ethereum', 'solana', 'pepe', 'meme', 'new'];
      const map = {};
      for (const q of queries) {
        try {
          const d = await fetchJson('https://api.dexscreener.com/latest/dex/search?q=' + encodeURIComponent(q));
          for (const p of d.pairs || []) {
            const chain = (p.chainId || '').toLowerCase();
            if (!CHAINS.has(chain)) continue;
            const addr = (p.baseToken && p.baseToken.address || '').toLowerCase();
            if (!addr) continue;
            const liq = +(p.liquidity && p.liquidity.usd || 0);
            const age = (Date.now() - (p.pairCreatedAt || Date.now())) / 3600000;
            if (liq < 5000 || age > 48) continue;
            const mcap = +(p.marketCap || p.fdv || 0);
            const v24 = +(p.volume && p.volume.h24 || 0);
            const vm = mcap > 0 ? (v24 / mcap) * 100 : (v24 / liq) * 100;
            const ch24 = +(p.priceChange && p.priceChange.h24 || 0);
            const key = chain + ':' + addr;
            const row = { p, liq, mcap, v24, vm, ch24, age, chain };
            const prev = map[key];
            if (!prev || liq > prev.liq) map[key] = row;
          }
        } catch (e) { console.warn(e); }
      }
      const rows = Object.values(map).sort((a, b) => b.vm - a.vm).slice(0, 40);
      grid.innerHTML = rows.map(({ p, vm, ch24, mcap, liq }) => {
        let risk = 'low';
        let riskCls = 'risk-low';
        let flags = [];
        if (vm > 80) { risk = 'high'; riskCls = 'risk-high'; flags.push('Экстремальный Vol/MCap'); }
        else if (vm > 40) { risk = 'mid'; riskCls = 'risk-mid'; flags.push('Высокий Vol/MCap'); }
        if (ch24 > 80) { flags.push('Взлет 24ч'); risk = risk === 'low' ? 'mid' : 'high'; riskCls = risk === 'high' ? 'risk-high' : 'risk-mid'; }
        if (ch24 < -25) flags.push('Резкое падение');
        return `
          <div class="coin-card" style="cursor:default">
            <div class="sym">${p.baseToken.symbol} <span class="muted">(${p.chainId})</span></div>
            <div class="name">${p.baseToken.name}</div>
            <div class="${riskCls} mono" style="margin:8px 0">Риск: ${risk === 'high' ? 'высокий' : risk === 'mid' ? 'средний' : 'ниже среднего'}</div>
            <div class="muted" style="font-size:0.8rem">Vol/MCap: ${vm.toFixed(0)}% · 24ч ${ch24.toFixed(1)}%</div>
            <div class="muted" style="font-size:0.8rem;margin-top:6px">${flags.join(' · ') || '—'}</div>
            <a href="${p.url}" target="_blank" rel="noopener" style="color:var(--accent);font-size:0.85rem">DexScreener →</a>
          </div>`;
      }).join('');
    } catch (e) {
      grid.innerHTML = '<p class="risk-high">Ошибка: ' + (e.message || e) + '</p>';
    }
  }

  async function loadNews() {
    const el = document.getElementById('newsList');
    try {
      const d = await fetchJson('https://min-api.cryptocompare.com/data/v2/news/?lang=RU');
      const items = d.Data || [];
      el.innerHTML = items.slice(0, 40).map(n => {
        const sent = (n.sentiment || '').toLowerCase();
        let b = 'badge-wait';
        if (sent.includes('positive')) b = 'badge-buy';
        if (sent.includes('negative')) b = 'badge-sell';
        const ago = new Date(n.published_on * 1000).toLocaleString('ru-RU');
        return `<div class="news-item">
          <div class="badge ${b}">${n.source || 'новость'}</div>
          <div style="font-weight:600;margin-top:6px"><a href="${n.url}" target="_blank" rel="noopener" style="color:var(--txt);text-decoration:none">${n.title}</a></div>
          <div class="muted">${ago}</div>
        </div>`;
      }).join('');
    } catch (e) {
      try {
        const t = await fetchJson('https://api.coingecko.com/api/v3/search/trending');
        el.innerHTML = '<p class="muted">CryptoCompare недоступен. Тренды CoinGecko:</p>' +
          (t.coins || []).map(c => `<div class="news-item"><b>${c.item.name}</b> (${c.item.symbol})</div>`).join('');
      } catch (e2) {
        el.innerHTML = '<p class="risk-high">Новости недоступны</p>';
      }
    }
  }

  let portfolio = JSON.parse(localStorage.getItem('crypto_dash_pf') || '[]');

  function savePf() {
    localStorage.setItem('crypto_dash_pf', JSON.stringify(portfolio));
  }

  function renderPortfolio() {
    const priceBySym = {};
    marketData.forEach(c => { priceBySym[c.symbol.toUpperCase()] = +c.current_price; });

    let total = 0, cost = 0;
    const rows = portfolio.map((pos, i) => {
      const sym = pos.sym.toUpperCase();
      const px = priceBySym[sym] || pos.buy;
      const val = px * pos.amt;
      const cst = pos.buy * pos.amt;
      total += val;
      cost += cst;
      const pnl = val - cst;
      return `<div class="coin-card">
        <div class="sym">${sym} <span class="muted mono">${pos.amt}</span></div>
        <div class="muted">${pos.note || ''}</div>
        <div class="mono" style="margin-top:8px">Сейчас: ${fmtUsd(px)} · PnL: <span class="${pnl >= 0 ? 'chg up' : 'chg down'}">${fmtUsd(pnl)}</span></div>
        <button type="button" class="btn" style="margin-top:8px" data-idx="${i}">Удалить</button>
      </div>`;
    }).join('');
    document.getElementById('pfList').innerHTML = rows || '<p class="muted">Пусто</p>';
    document.getElementById('pfSummary').textContent =
      `Стоимость: ${fmtUsd(total)} · Вложено: ${fmtUsd(cost)} · PnL: ${fmtUsd(total - cost)} (${cost ? ((total - cost) / cost * 100).toFixed(2) : 0}%)`;

    document.querySelectorAll('#pfList button').forEach(btn => {
      btn.addEventListener('click', () => {
        portfolio.splice(+btn.dataset.idx, 1);
        savePf();
        renderPortfolio();
      });
    });
  }

  document.getElementById('pfAdd').addEventListener('click', () => {
    const sym = (document.getElementById('pfSym').value || '').trim().toUpperCase();
    const amt = +document.getElementById('pfAmt').value;
    const buy = +document.getElementById('pfBuy').value;
    const note = (document.getElementById('pfNote').value || '').trim();
    if (!sym || !amt || !buy) return;
    portfolio.push({ sym, amt, buy, note });
    savePf();
    renderPortfolio();
  });

  document.querySelectorAll('#tabNav .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#tabNav .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const id = tab.dataset.tab;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + id).classList.add('active');
    });
  });

  function tickClock() {
    document.getElementById('clock').textContent = new Date().toLocaleString('ru-RU');
  }

  document.getElementById('scamReload').addEventListener('click', loadScam);

  async function refreshAll() {
    tickClock();
    await loadMarket();
    renderPortfolio();
    await loadNews();
    if (document.getElementById('page-scam').classList.contains('active')) await loadScam();
  }

  refreshAll();
  setInterval(refreshAll, 90000);
  setInterval(tickClock, 1000);
})();
</script>
</body>
</html>
