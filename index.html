<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crypto Bot Mini App</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#090d17;--card:#11182a;--line:#24304a;--txt:#eaf0ff;--muted:#8e9cb8;--ok:#00d084;--warn:#ffbe3b;--bad:#ff5f7d}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,Arial}
    .app{max-width:1100px;margin:auto;padding:14px}
    .tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:rgba(9,13,23,.92);padding-bottom:8px}
    .tab{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
    .tab.active{border-color:var(--ok);color:var(--ok)}
    .page{display:none}.page.active{display:block;animation:fade .22s ease}
    @keyframes fade{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,select,button{border:1px solid var(--line);background:#0d1425;color:var(--txt);padding:8px;border-radius:8px}
    button{cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
    .muted{color:var(--muted);font-size:12px}
    .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  </style>
</head>
<body>
<div class="app">
  <h3>Crypto Bot Mini App</h3>
  <div class="tabs">
    <button class="tab active" onclick="showTab('market',this)">Market</button>
    <button class="tab" onclick="showTab('signals',this)">Signals</button>
    <button class="tab" onclick="showTab('trends',this)">Trends</button>
    <button class="tab" onclick="showTab('screener',this)">Screener</button>
    <button class="tab" onclick="showTab('sniper',this)">Sniper</button>
    <button class="tab" onclick="showTab('scam',this)">Scam Detector</button>
    <button class="tab" onclick="showTab('portfolio',this)">Portfolio</button>
    <button class="tab" onclick="showTab('alerts',this)">Alerts</button>
  </div>

  <section id="market" class="page active">
    <div class="card row">
      <input id="mSym" placeholder="bitcoin">
      <button onclick="loadChart()">Load Chart</button>
      <span id="mInfo" class="muted">—</span>
    </div>
    <div class="card"><canvas id="chart" height="110"></canvas></div>
  </section>

  <section id="signals" class="page"><div id="signalsList" class="grid"></div></section>
  <section id="trends" class="page"><div id="trendsList" class="grid"></div></section>

  <section id="screener" class="page">
    <div class="card row"><button onclick="loadScreener()">Refresh Screener</button><span class="muted">Live DexScreener, age &lt; 24h, liquidity &gt; $5k.</span></div>
    <div id="screenerList" class="grid"></div>
  </section>

  <section id="sniper" class="page">
    <div class="card row"><button onclick="loadSniper()">Refresh Sniper</button><span class="muted">Last 60 min listings + scam check.</span></div>
    <div id="sniperList" class="grid"></div>
  </section>

  <section id="scam" class="page">
    <div class="card row"><button onclick="loadScamDetector()">Run Scam Detector</button><span class="muted">Detects possible pump-dump setups from live Dex + GoPlus.</span></div>
    <div id="scamList" class="grid"></div>
  </section>

  <section id="portfolio" class="page">
    <div class="card row"><input id="pSym" placeholder="ETH"><input id="pQty" type="number" placeholder="Qty"><input id="pBuy" type="number" placeholder="Buy Price"><button onclick="addPortfolio()">Add</button></div>
    <div id="pnl" class="card">PnL: —</div>
    <div id="portfolioList" class="grid"></div>
  </section>

  <section id="alerts" class="page">
    <div class="card row"><input id="aSym" placeholder="PEPE"><select id="aType"><option value="above">above</option><option value="below">below</option></select><input id="aPrice" type="number" placeholder="price"><button onclick="addAlert()">Add Alert</button></div>
    <div id="alertsList" class="grid"></div>
  </section>
</div>

<script>
let chartRef=null, marketRows=[], portfolio=JSON.parse(localStorage.getItem('pf')||'[]'), alerts=JSON.parse(localStorage.getItem('al')||'[]');
const fmt=n=>n>=1e9?`$${(n/1e9).toFixed(2)}B`:n>=1e6?`$${(n/1e6).toFixed(2)}M`:n>=1e3?`$${(n/1e3).toFixed(1)}K`:`$${(+n||0).toFixed(2)}`;
const chains=new Set(['ethereum','bsc','solana','base','arbitrum','polygon']);
function showTab(id,el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
async function j(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}

async function loadChart(){
  const id=(document.getElementById('mSym').value||'bitcoin').trim().toLowerCase();
  const d=await j(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=30`);
  const p=d.prices||[]; document.getElementById('mInfo').textContent=`${id} · ${p.length} points`;
  const ctx=document.getElementById('chart').getContext('2d'); if(chartRef)chartRef.destroy();
  chartRef=new Chart(ctx,{type:'line',data:{labels:p.map(x=>new Date(x[0]).toLocaleDateString()),datasets:[{data:p.map(x=>x[1]),pointRadius:0,borderColor:'#00d084'}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false}}}});
}

function riskBar(v){const c=v<35?'var(--ok)':v<65?'var(--warn)':'var(--bad)';return `<div style="height:8px;background:#1b243b;border-radius:8px;overflow:hidden"><div style="height:8px;width:${Math.max(2,Math.min(100,v))}%;background:${c}"></div></div>`}
function card(r){return `<div class="card"><b>${r.name} (${r.symbol})</b><div class="muted">${r.chain} · ${r.age.toFixed(2)}h</div><div>💧 ${fmt(r.liq)} | 💰 ${fmt(r.mcap)} | 📊 ${fmt(r.v24)}</div><div>Whale concentration: ${r.whale||'N/A'}%</div><div>Scam: <span class="${r.risk<35?'ok':r.risk<65?'warn':'bad'}">${r.risk}/100</span></div>${riskBar(r.risk)}<a href="${r.url}" target="_blank">DexScreener</a></div>`}

async function getDexRows(){
  const queries=['ethereum','bsc','solana','base','arbitrum','polygon','pepe','doge','shib','cat','moon','elon','baby','inu','wojak','bonk'];
  const map={};
  for(const q of queries){
    const d=await j(`https://api.dexscreener.com/latest/dex/search?q=${encodeURIComponent(q)}`).catch(()=>({pairs:[]}));
    for(const p of (d.pairs||[])){
      const chain=(p.chainId||'').toLowerCase(); if(!chains.has(chain)) continue;
      const addr=(p.baseToken?.address||'').toLowerCase(); if(!addr) continue;
      const liq=+(p.liquidity?.usd||0), age=Math.max(0,(Date.now()-(p.pairCreatedAt||Date.now()))/3600000);
      if(liq<=5000 || age>=24) continue;
      const k=`${chain}:${addr}`; const old=map[k];
      const row={name:p.baseToken?.name||'Unknown',symbol:p.baseToken?.symbol||'UNK',chain,liq,mcap:+(p.marketCap||p.fdv||0),v24:+(p.volume?.h24||0),v1:+(p.volume?.h1||0),age,url:p.url||'#',contract:p.baseToken?.address||''};
      if(!old || row.liq>old.liq) map[k]=row;
    }
  }
  marketRows=Object.values(map).sort((a,b)=>b.v1-a.v1).slice(0,25);
  return marketRows;
}

async function loadScreener(){const rows=await getDexRows();document.getElementById('screenerList').innerHTML=rows.map(r=>card({...r,risk:30})).join('')}
async function loadSniper(){
  const rows=(await getDexRows()).filter(x=>x.age<=1).slice(0,20).map(x=>({...x,risk:Math.max(5,100-Math.min(90,x.liq/1500))}));
  document.getElementById('sniperList').innerHTML=rows.map(card).join('');
}
async function loadSignals(){const rows=(await getDexRows()).slice(0,12).map(x=>({...x,risk:20+(x.age*2)}));document.getElementById('signalsList').innerHTML=rows.map(card).join('')}
async function loadTrends(){const d=await j('https://api.coingecko.com/api/v3/search/trending').catch(()=>({coins:[]}));document.getElementById('trendsList').innerHTML=(d.coins||[]).map(x=>`<div class="card"><b>${x.item.name} (${(x.item.symbol||'').toUpperCase()})</b><div class="muted">Rank #${x.item.market_cap_rank||'?'}</div></div>`).join('')}
async function enrichWhaleAndRisk(rows){
  const chainMap={ethereum:'1',bsc:'56',base:'8453',arbitrum:'42161',polygon:'137'};
  const out=[];
  for(const r of rows){
    const c=chainMap[r.chain];
    if(!c){out.push({...r,risk:35,whale:'N/A'});continue;}
    const sec=await j(`https://api.gopluslabs.io/api/v1/token_security/${c}?contract_addresses=${r.contract}`).catch(()=>null);
    const item=(sec?.result?.[r.contract?.toLowerCase?.()])||(sec?.result?.[r.contract])||Object.values(sec?.result||{})[0]||{};
    const whale=Math.round((+item.owner_percent||0)*100);
    let risk=0;
    if(whale>=80) risk+=30;
    if(item.is_honeypot==='1') risk+=50;
    if(item.is_mintable==='1') risk+=15;
    if(item.is_renounced!=='1') risk+=12;
    if(item.is_locked!=='1') risk+=10;
    if((+item.sell_tax||0)>0 || (+item.buy_tax||0)>0) risk+=10;
    if((r.v1/(r.liq||1))>5) risk+=10;
    out.push({...r,risk:Math.min(100,risk),whale:isNaN(whale)?'N/A':whale});
  }
  return out;
}
async function loadScamDetector(){
  const rows=await getDexRows();
  const enriched=await enrichWhaleAndRisk(rows.slice(0,20));
  const risky=enriched.filter(x=>x.risk>=60).sort((a,b)=>b.risk-a.risk);
  document.getElementById('scamList').innerHTML=(risky.length?risky:enriched.slice(0,10)).map(card).join('');
}

function addPortfolio(){const s=(pSym.value||'').toUpperCase(),q=+pQty.value,b=+pBuy.value;if(!s||!q||!b)return;portfolio.push({s,q,b});localStorage.setItem('pf',JSON.stringify(portfolio));renderPortfolio()}
function renderPortfolio(){
  let v=0,c=0; const rows=portfolio.map((x,i)=>{const m=marketRows.find(r=>r.symbol===x.s);const p=m?m.mcap/Math.max(1,m.v24):x.b;const val=p*x.q,cost=x.b*x.q;v+=val;c+=cost;return `<div class="card">${x.s} ${x.q}<br>Buy: ${fmt(x.b)}<br>Now: ${fmt(p)}<br><span class="${val-cost>=0?'ok':'bad'}">${fmt(val-cost)}</span> <button onclick="delPf(${i})">x</button></div>`}); portfolioList.innerHTML=rows.join(''); pnl.textContent=`PnL: ${fmt(v-c)} (${c?(((v-c)/c)*100).toFixed(2):0}%)`}
function delPf(i){portfolio.splice(i,1);localStorage.setItem('pf',JSON.stringify(portfolio));renderPortfolio()}

function addAlert(){const s=(aSym.value||'').toUpperCase(),t=aType.value,p=+aPrice.value;if(!s||!p)return;alerts.push({s,t,p,hit:false});localStorage.setItem('al',JSON.stringify(alerts));renderAlerts()}
function renderAlerts(){alertsList.innerHTML=alerts.map((a,i)=>`<div class="card">${a.s} ${a.t} ${fmt(a.p)} ${a.hit?'<span class="ok">TRIGGERED</span>':''} <button onclick="delAl(${i})">x</button></div>`).join('')}
function delAl(i){alerts.splice(i,1);localStorage.setItem('al',JSON.stringify(alerts));renderAlerts()}
function checkAlerts(){for(const a of alerts){if(a.hit)continue;const m=marketRows.find(r=>r.symbol===a.s);if(!m)continue;const price=m.mcap/Math.max(1,m.v24);if((a.t==='above'&&price>=a.p)||(a.t==='below'&&price<=a.p)){a.hit=true;}}localStorage.setItem('al',JSON.stringify(alerts));renderAlerts()}

loadChart(); loadSignals(); loadTrends(); loadScreener(); loadSniper(); loadScamDetector(); renderPortfolio(); renderAlerts();
setInterval(async()=>{await loadScreener();await loadSniper();checkAlerts();renderPortfolio()},60000);
</script>
</body>
</html>
